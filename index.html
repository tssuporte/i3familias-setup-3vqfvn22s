<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <title>Family Hub</title>
    <meta name="description" content="A plataforma inteligente para a gestão da sua casa." />
    <meta name="theme-color" content="#98a428" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="https://img.usecurling.com/i?q=home&color=green&shape=fill" />
    <link rel="apple-touch-icon" href="https://img.usecurling.com/i?q=home&color=green&shape=fill" />

  <body>
    <div id="root"></div>
    <script src="https://goskip.dev/skip.js"></script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(error => {
            console.error('ServiceWorker registration failed: ', error);
          });
        });
      }
    </script>
  </body>
</html>
